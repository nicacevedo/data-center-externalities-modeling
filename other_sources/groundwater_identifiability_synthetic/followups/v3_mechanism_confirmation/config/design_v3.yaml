  fine_step_interpretation: one_week
  seasonal_period_fine_steps: 52
  burn_in_floor_fine_steps: 104
  burn_in_rule: max(burn_in_floor_fine_steps, ceil(burn_in_tau_multiple * tau_relax_realized))
  burn_in_tau_multiple: 8.0
  analysis_horizon_fine_steps: 520
  analysis_horizon_seasonal_cycles: 10
  cadences_fine_steps:
  - 1
  - 2
  - 4
  - 13
  cadence_labels:
    1: weekly
    2: biweekly
    4: monthly_approx
    13: quarterly
  usable_transitions_by_cadence:
