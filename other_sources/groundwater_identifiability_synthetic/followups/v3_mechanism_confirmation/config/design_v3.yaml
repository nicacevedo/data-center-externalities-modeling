      validation: 39
      test: 39
    4:
      train: 90
      validation: 19
      test: 20
    13:
      train: 27
      validation: 6
      test: 6
  data_poor_cadences:
  - 13
memory_regimes:
  definition_realized: tau_relax_realized = -1.0 / log(spectral_radius(A))
  realized_is_authoritative: true
  nominal_labels_are_targets_only: true
  targets_fine_steps:
    LOW: 4.0
    MED: 20.0
    HIGH: 80.0
  target_match_tolerance: 0.02
  reported_ratio: cadence_over_tau_relax_realized = k / tau_relax_realized
stability:
  diagonal_margin_delta_diag: 0.05
  diagonal_condition: dt * (sum_j C_ij + C_i0) / S_i <= 1 - delta_diag  for all i
  all_v2_scenarios_intended_contracting: true
  all_v1_scenarios_intended_contracting: true
  contraction_margin_delta: 0.005
  contraction_condition: spectral_radius(A) <= 1 - delta
  require_positive_boundary_leakage: true
  non_contracting_systems: OUT_OF_SCOPE_V1
dgp:
  state_equation: "S_i * (h_{i,t+1} - h_{i,t}) / dt\n  = R_{i,t} - Q_{i,t}\n    + sum_{j != i} C_ij *\
    \ (h_{j,t} - h_{i,t})\n    + C_i0 * (h_i_b - h_{i,t})\n    + eps_{i,t}\n"
  observation_equation: y_{i,t} = h_{i,t} + nu_{i,t}
  matrix_form: h_{t+1} = A h_t + b + dt * diag(1/S) * (R_t - Q_t + eps_t)
  A_definition: A = I - dt * diag(1/S) * L ;  L_ii = sum_{j!=i} C_ij + C_i0 ;  L_ij = -C_ij
  B_R_definition: B_R = dt * diag(1/S)
  B_Q_definition: B_Q = dt * diag(1/S)
  restriction_note: 'B_R == B_Q encodes unit recharge efficiency. This restriction is itself stressed
    in scenario S7 variant recharge_efficiency_mismatch, where the truth uses B_R != B_Q while the estimator
    retains the restricted family.

    '
  boundary_intercept: b_i = dt * C_i0 * h_i_b / S_i
  boundary_head_h_b: 5.0
  process_noise_semantics: FLUX_DISTURBANCE
  process_noise_note: 'eps has the same units as R and Q and enters head as dt * eps_i / S_i, consistent
    with its position inside the storage balance.     An additive head-state disturbance is a DIFFERENT
    object and is NOT used in v2.

    '
  process_noise_sd_default: 0.05
  storage_S_base: 1.0
  storage_S_heterogeneity: 0.25
  derivation: 'r_i = dt * (sum_j C_ij + C_i0) / S_i is the total relaxation rate. For target tau and coupling
    share gamma, r = (1 - exp(-1/tau)) / (1 - gamma); neighbour conductances carry share gamma of r and
    boundary leakage carries (1 - gamma).

    '
