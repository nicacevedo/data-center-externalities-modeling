forcing:
  recharge:
    mean: 1.2
    seasonal_amplitude: 0.5
    ar1_phi: 0.8
    ar1_innovation_sd: 0.08
    nonnegativity: clip_at_zero
  pumping:
    mean: 1.0
    seasonal_amplitude: 0.4
    ar1_phi: 0.7
    ar1_innovation_sd: 0.06
    independent_excitation_sd: 0.15
    nonnegativity: clip_at_zero
  max_clip_fraction: 0.001
  confounding_rho_levels:
  - 0.0
  - 0.3
  - 0.6
  - 0.9
  per_node_phase_offsets: frozen_uniform_over_period
observation:
  snr_definition: snr_head = sd(h over burn-in window) / sd(nu)
  snr_levels:
  - 2
  - 5
  - 10
  - 20
  - .inf
  forcing_aggregation: interval_sum_over_cadence_interval
  pumping_quality_regimes:
    P-EXACT:
      description: exact absolute pumping in model flux units
      absolute_scale_known: true
    P-MULTNOISE:
      description: multiplicative measurement noise, mean-corrected unit-mean (E[m]=1; median exp(-s^2/2))
      form: Q_obs = Q_true_interval * exp(N(0, s^2) - s^2/2)
      s_default: 0.1
      absolute_scale_known: true
    P-SCALEBIAS:
      description: unknown constant multiplicative scale bias, one draw per replicate
      form: Q_obs = c * Q_true_interval,  log(c) ~ N(0, 0.30^2)
      absolute_scale_known: false
    P-TEMPAGG:
      description: 'reported only as annual (52 fine-step) totals, disaggregated back to cadence intervals
        by a FIXED mean seasonal template, destroying within-year variation

        '
      absolute_scale_known: true
    P-SPATIALAGG:
      description: 'only a basin total is reported, allocated to nodes by a fixed imperfect share vector
        (true mean shares perturbed by Dirichlet noise, one draw per replicate)

        '
      dirichlet_concentration: 60.0
      absolute_scale_known: false
  recharge_quality_regimes:
    R-EXACT:
      form: R_proxy = R_true_interval
    R-NOISE:
      form: R_proxy = R_true_interval + N(0, sigma * sd(R_interval))
      sigma_default: 0.2
    R-LAG:
      form: R_proxy = R_true_interval lagged by lag_fine_steps
      lag_default: 4
    R-NOISELAG:
      form: both
      sigma_default: 0.2
      lag_default: 4
    R-SCALE:
      form: R_proxy = c * R_true_interval, log(c) ~ N(0, 0.30^2)
  latent_recharge_never_exposed: true
  missingness:
    mcar_fraction_levels:
    - 0.0
    - 0.1
    - 0.3
    - 0.5
    block_outage:
      description: contiguous station dropout, applied on top of MCAR
      blocks_per_node_levels:
      - 0
      - 1
      - 2
      block_length_cadence_steps: 8
    observed_node_fraction_levels:
    - 0.4
    - 0.6
    - 0.8
    - 1.0
    mnar: NOT_MODELLED_IN_V1
  head_interpolation: PROHIBITED
splits:
  type: chronological
  train_fraction: 0.7
  validation_fraction: 0.15
  test_fraction: 0.15
  preprocessing_fit_on: TRAIN_ONLY
  complexity_selection_on: VALIDATION_ONLY
  test_usage: PROTECTED_FINAL_METRICS_ONLY
  prohibited_test_selection:
  - model_family
  - regularization_lambda
  - kernel_bandwidth
  - graph_complexity
  - edge_thresholds
  - stopping_rules
  synthetic_truth_is_not_a_validation_signal: true
models:
  common_features:
  - intercept
  - own_level_lag1
  - season_sin
  - season_cos
  - time_trend
  B0:
    description: background / no-managed-forcing baseline
    extra_features: []
  L:
    description: local forcing response; conceptual analogue of the M1L tier
    extra_features:
    - own_pumping
    - own_recharge_proxy
  S:
    description: spatial forcing without a dynamic head-flow network
    extra_features:
    - kernel_weighted_neighbour_pumping
    - kernel_weighted_neighbour_recharge
    kernel: exp(-d_ij / lambda_km)
    kernel_bandwidth_grid:
    - 0.5
    - 1.0
    - 2.0
    - 4.0
    bandwidth_selected_on: VALIDATION_ONLY
    uses_true_adjacency: false
  N:
    description: minimal dynamic groundwater network
    extra_features:
    - own_pumping
    - own_recharge_proxy
    - candidate_head_differences
    head_difference_term: kappa_ij * (y_j - y_i) for j in candidate_neighbours(i)
    nonnegativity_constrained:
    - kappa
    unconstrained_and_unpenalized:
    - own_pumping
    - own_recharge_proxy
    - intercept
    - own_level_lag1
    - season_sin
    - season_cos
    - time_trend
    pumping_sign_is_NOT_constrained: true
    penalty_grid_lambda:
    - 0.0
    - 0.001
    - 0.003
    - 0.01
    - 0.03
    - 0.1
    - 0.3
    - 1.0
    penalty_selected_on: VALIDATION_ONLY
    row_admissibility: 'a cadence row tau is usable for node i only if y_i[tau], y_i[tau+1] and y_j[tau]
      for every candidate neighbour j are observed. Unobserved nodes are removed from the candidate set
      entirely. No head is interpolated to rescue a row.

      '
network_semantics:
  kappa_definition: kappa_ij = dt * C_ij / S_i
  kappa_is_effective_directed_coupling: true
  symmetry_enforced: false
  symmetry_note: kappa_ij != kappa_ji in general because S_i != S_j
  edge_support: UNDIRECTED
  edge_support_rule: an undirected pair is present if EITHER direction is selected
  true_strong_edge_rule: max((A^k)_ij, (A^k)_ji) >= 0.01
  detected_edge_rule: max(kappa_hat_ij, kappa_hat_ji) >= 0.01
  strong_edge_threshold: 0.01
  true_strong_edges_outside_candidate_set_count_as: FALSE_NEGATIVE
  physical_conductance_reconstruction:
    permitted_only_when: absolute_S_identifiable
    formula: C_hat_ij = kappa_hat_ij * S_hat_i / dt
    S_hat_formula: S_hat_i = -dt / beta_hat_Q_i
  physics_consistency_diagnostic:
    name: D_phys
    formula: "D_phys_ij = abs(kappa_hat_ij*S_hat_i - kappa_hat_ji*S_hat_j)\n            / (abs(kappa_hat_ij*S_hat_i)\
      \ + abs(kappa_hat_ji*S_hat_j) + epsilon_stab)\n"
    epsilon_stab: 1.0e-09
    range:
    - 0
    - 1
    interpretation: D_phys near 0 indicates directional consistency with a common physical conductance
    interpretable_only_when:
    - absolute_S_identifiable is true
    - both directional estimates nondegenerate (kappa_hat_ij >= strong_edge_threshold and kappa_hat_ji
      >= strong_edge_threshold)
    otherwise: reported as null, never as a numeric value
estimands:
  exact_coarse_dynamics: h_{t+k} = A^k h_t + sum_{r=0}^{k-1} A^{k-1-r} B u_{t+r}
  aggregation_note: 'With only the interval aggregate U = sum_r u_{t+r} observed there is in general NO
    exact B_k with sum_r A^{k-1-r} B u_{t+r} = B_k U for all forcing paths.

    '
  k_equals_1:
    direct_fine_parameter_recovery: PRIMARY
    targets:
    - A
    - B_Q
    - kappa
    - S
  k_greater_than_1:
    direct_fine_parameter_recovery: NOT_PRIMARY
    A_hat_compared_to: A_to_the_k
    A_comparison_caveat: 'A_hat also absorbs forcing-aggregation effects, so this comparison is reported
      as state-transition recovery, not as clean parameter recovery.

      '
    primary_targets:
    - protected_transition_recovery
    - intervention_recovery
    - impulse_response_recovery
  pseudo_true_coarse_coefficient:
    reported: only_where_it_aids_interpretation
    always_labelled_as_pseudo_true: true
    definition: 'B_k_pseudo := argmin_B  E_forcing || sum_{r=0}^{k-1} A^{k-1-r} B u_{t+r} - B U ||^2

      '
    property: population L2 projection onto the aggregate-forcing linear family
    depends_on_forcing_process: true
    computed_in: evaluation_layer_from_truth
    monte_carlo_draws: 400
  absolute_S_and_C_identifiable_only_when:
  - pumping observed on a true absolute scale (P-EXACT or P-MULTNOISE)
  - pumping-channel parameterization holds (B_Q = dt * diag(1/S))
  - excitation sufficient (measured by the identifiability diagnostics, not assumed)
  - cadence k == 1
  otherwise_report: EFFECTIVE_RESPONSE_COEFFICIENTS_ONLY
  otherwise_prohibited:
  - physical_storage
  - physical_conductance
  intervention_recovery_kinds:
    RELATIVE:
      description: shape and ratios of delta_h; invariant to unknown forcing scale
    ABSOLUTE:
      description: delta_h per unit of ABSOLUTE withdrawal
      requires_absolute_scale_known: true
  planning_readiness_rule: 'A regime whose pumping scale is unknown (P-SCALEBIAS, P-SPATIALAGG, R-SCALE)
    can NEVER be scored as planning-ready for absolute withdrawal constraints, regardless of how good
    its relative recovery is.

    '
interventions:
  launched_at: PROTECTED_TEST_ONSET
  never_used_for:
  - fitting
  - hyperparameter_selection
  - model_selection
  - thresholding
  pairing:
    baseline_and_intervention_share:
    - initial_state
    - recharge_and_background_forcing
    - process_noise_realization_eps
    estimand: delta_h = h_intervention - h_baseline
    rationale: common disturbances cancel exactly in the paired difference
  also_report_noise_free_structural_response: true
  magnitude_fraction_of_mean_pumping: 0.5
  types:
    pulse:
      description: additional pumping over a single cadence interval at onset
      duration_fine_steps: null
    persistent_step:
      description: sustained additional pumping, then release, to observe recovery
      duration_fine_steps: 26
    new_node_pumping:
      description: step applied at the node with the LOWEST mean pumping
      duration_fine_steps: 26
      node_selection: lowest_mean_true_pumping
    multi_node_withdrawal:
      description: simultaneous step at two nodes
      duration_fine_steps: 26
      n_nodes: 2
  horizons_fine_steps:
  - 4
  - 13
  - 26
  - 52
  horizon_rule: 'evaluated at ceil(H / k) cadence steps; a horizon is reported only if it is at least
    one cadence step and fits inside the protected test segment

    '
  cumulative_drawdown_horizon_fine_steps: 52
  primary_horizon_fine_steps: 26
spatial_evaluation:
  zero_shot_held_out_node: NOT_PERFORMED_IN_V2
  zero_shot_rationale: 'B0/L/S/N use NODE-SPECIFIC parameters, so a node entirely absent from training
    has no estimated parameters and zero-shot inference at that node is not mathematically possible. A
    fully held-out-node experiment would require an explicitly shared-parameter model, which v2 does not
    implement.

    '
  protected_future_time_evaluation:
    description: standard chronological protected-test evaluation for nodes with training history
    enabled: true
  masked_node_protocol:
    description: evaluates PROPAGATION THROUGH MONITORING LOSS, not zero-shot prediction
    preconditions:
    - the masked node HAS train/validation history
    - the masked node's parameters are estimable from that history
    onset: PROTECTED_TEST_ONSET
    mask_horizon_cadence_steps: 12
    mask_horizon_rule: min(12, protected_test_length_cadence_steps)
    recursion_initial_state: final admissible PRE-MASK head observation of the masked node
    min_completed_steps: 4
    permitted_inputs_after_onset:
    - own predicted state from the recursion
    - own observed pumping and recharge proxy
    - observed heads of NON-masked neighbours
    - 'most recent observed head of a NON-masked neighbour when that neighbour is missing at the current
      instant (operational nowcast of a station that is still monitored)

      '
    - deterministic calendar features
    prohibited_inputs_after_onset:
    - any withheld head observation of the masked node
    - carry-forward of the masked node's own head
    neighbour_carry_forward_rationale: 'Without neighbour carry-forward the recursion aborts on the first
      missing neighbour head, so at the reference regime''s 10% missingness the masked-node criterion
      would be unevaluable in most replicates. Carry-forward applies ONLY to non-masked neighbours, never
      to the masked node, and the number of carried-forward steps is reported as a diagnostic (masked_node_carry_forward_steps_*).
      A replicate contributes to the criterion only if at least min_completed_steps recursion steps completed.

      '
    leak_enforcement: 'test_masked_node_no_leak poisons every withheld entry with a large sentinel value
      and asserts the recursive forecast is bit-identical to the NaN-masked run

      '
    masked_node_selection:
      timing: BEFORE_MISSINGNESS_REALIZED
      fallback_after_missingness: PROHIBITED
      by_topology:
        single: 0
        star5: 0
        path5: 2
        path5_hidden: 2
        bridge6: 2
        null5: 2
      if_target_unobserved_or_not_estimable: NOT_ESTIMABLE
      no_adaptive_substitution: true
    start_instant_rule: 'Find the last admissible PRE-MASK head observation of the frozen target node
      (instant t_anchor < TEST_onset). If t_anchor < TEST_onset - 1, recursively propagate internally
      from t_anchor up to TEST_onset. Those warm-forward predictions are NOT scored. Score only predictions
      aligned exactly with TEST-onset truth and subsequent protected TEST times (heads at instants onset,
      onset+1, ..., onset+horizon-1). If no admissible pre-mask observation exists, status = NOT_ESTIMABLE
      (reason unavailable_mask_anchor). Do not start scoring from an earlier instant.

      '
    missing_reason_reporting: 'masked_node_status_{L,S,N} records OK, NOT_ESTIMABLE, NO_START_OBSERVATION,
      RECURSION_STOPPED_EARLY, or HORIZON_TOO_SHORT. masked_node_status records EVALUATED, NOT_ESTIMABLE,
      TARGET_UNOBSERVED, NO_OBSERVED_NODES, or HORIZON_TOO_SHORT. Warm-forward length is recorded as masked_node_warm_forward_steps_*.

      '
metrics:
  predictive_are_secondary: true
  predictive:
  - rmse_protected_test
  - mae_protected_test
  - normalized_transition_error
  - improvement_vs_B0
  primary:
  - normalized_intervention_response_error
  - step_response_error
  - cumulative_drawdown_error
  - vulnerability_rank_spearman
  - vulnerability_rank_topk_overlap
  nire_definition: NIRE = ||delta_h_hat - delta_h_true||_2 / ||delta_h_true||_2
  nire_node_inclusion_threshold: 0.01
  topk_k: 2
  parameter_recovery:
    metrics:
    - relative_parameter_error
    - sign_recovery
    - storage_response_recovery
    - coupling_strength_recovery
    subject_to: estimands.k_equals_1 / estimands.k_greater_than_1 rules
  network_recovery:
  - edge_precision
  - edge_recall
  - edge_f1
  - edge_false_positive_rate
  - edge_false_negative_rate
  - strong_coupling_weight_error
  - D_phys
  falsification:
  - false_edge_count
  - false_edge_any_fraction
  - false_pumping_effect_rate
  identifiability_diagnostics:
  - design_matrix_rank
  - singular_values
  - condition_number
  - pumping_excitation_residual_fraction
  - max_variance_inflation_factor
  diagnostics_distinguish:
  - structural_non_identifiability
  - practical_noise_driven_difficulty
physical_parameter_identifiability:
  recoverable_quantities_when_true:
  - S_i
  - C_ij
  otherwise_report:
  - A
  - effective_B_Q
  - kappa_ij
  - intervention_response
  kappa_semantics: kappa_ij = dt * C_ij / S_i
  requires_all:
    cadence_k_equals_1: true
    absolute_forcing_scale_known: true
    pumping_quality_in:
    - P-EXACT
    - P-MULTNOISE
    recharge_quality_in:
    - R-EXACT
    confounding_rho_equals: 0.0
    design_full_rank: true
    condition_number_below: 1.0e6
    pumping_excitation_fraction_above: 0.05
    scenario_not_in:
    - S7
    - S8
    - S6a
    - S6b
    - S9
  excluded_reason:
    S7: controlled misspecification of the physical parameterization
    S8: placebo channel is present; S/C recovery is not the estimand
    S6a: null network; no physical C_ij to recover
    S6b: null network; no physical C_ij to recover
    S9: candidate-support misspecification
    k_gt_1: no exact coarse physical S/C; report A^k and pseudo-true coarse B
    P-SCALEBIAS: unknown multiplicative pumping scale
    P-TEMPAGG: within-year pumping variation destroyed
    P-SPATIALAGG: spatial aggregation of pumping
    R-NOISE: recharge proxy is noisy; storage/conductance not separately pinned
    R-LAG: recharge timing misspecified
    R-NOISELAG: recharge noisy and lagged
    R-SCALE: recharge scale unknown
    confounding_rho_gt_0: seasonal pumping/recharge confounding prevents clean separation
estimability:
  states:
  - NOT_ESTIMABLE
  - FIT_FAILED
  - ESTIMATED
  gate_states_after_aggregation:
  - NOT_ESTIMABLE
  - FIT_FAILED
  - ESTIMATED_FAILED_GATE
  - ESTIMATED_PASSED_GATE
  reason_codes:
  - insufficient_training_rows
  - no_admissible_rows
  - rank_deficient
  - ill_conditioned
  - solver_failure
  - missing_required_forcing
