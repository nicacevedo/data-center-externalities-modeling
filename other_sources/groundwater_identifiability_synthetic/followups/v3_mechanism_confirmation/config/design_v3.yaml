  oracle_cells_may_not_compensate_for_not_estimable: true
uncertainty:
  iid_bootstrap: PROHIBITED_DEPENDENT_SERIES
  estimator: moving_block_bootstrap
  resampling_unit: contiguous TRAIN transition blocks of a single node
  block_length_rule: max(2, ceil(2.0 * tau_relax_realized / k))
  temporal_dependence: preserved_within_block
  n_bootstrap_analysis: 200
  n_bootstrap_smoke: 20
  nominal_interval: 0.9
  coverage_is_a_gate_criterion: false
  coverage_role: REPORTED_DIAGNOSTIC_ONLY
  monte_carlo_variability_reported_separately: true
  cadence_semantics:
    k_equals_1: 'interval coverage of the pumping coefficient may be compared to the fine-step physical
      -B_Q, and only then, and only where physical_parameter_identifiability is true. Label: bootstrap_coverage_beta_q_physical.

      '
    k_greater_than_1: 'NEVER compare a fitted coarse-cadence pumping coefficient to fine-step B_Q. Coverage,
      if reported, is relative to the pseudo-true coarse estimand (bootstrap_coverage_beta_q_pseudo_true)
      and is a diagnostic. Interval width and stability (bootstrap_interval_width_mean) are always reported.

      '
  promotion_to_gate: NOT_IN_V2
seeds:
  rng_implementation: numpy.random.Generator(PCG64) via numpy.random.SeedSequence
  spawn_protocol: SeedSequence(entropy=<pool_entropy>).spawn(n) then default_rng(child)
  pools:
    V3_DETERMINISM:
      entropy: 20260907030001
      n_seeds: 5
      role: deterministic implementation sanity only
    V3_SMOKE:
      entropy: 20260907030002
      n_seeds: 3
      role: ENGINEERING ONLY
    V3_ANALYSIS:
      entropy: 20260907030003
      n_seeds: 200
      role: substantive inference; outcomes unused in Pass 1 / Pass 1.1 / Pass 1.2
    V3_BENCHMARK:
      entropy: 20260907030004
      n_seeds: 128
      previous_n_seeds_pass1: 16
      n_seeds_change_rationale: 'Pass-1.1 pre-ANALYSIS correction. At n=16 several single-node /
        cadence-4 cells showed split-half benchmark-NIRE instability of order 0.07-0.10, which is
        too large relative to the preregistered 0.05 NIRE SESOI for a benchmark carrying major
        interpretive weight. Fixed prospectively at 128 before any V3 ANALYSIS replicate exists.
        Benchmark n is NOT adapted after inspecting convergence.

        '
      role: F_train_true / F_train_obs pseudo-true Monte Carlo approximation only
      convergence_prefixes:
      - 16
      - 32
      - 64
      - 128
      prefix_nesting: 'SeedSequence(entropy).spawn(n) is sequential, so spawn(128)[:m] == spawn(m)
        for m in {16, 32, 64}. The convergence prefixes are therefore strictly nested subsets of
        one deterministic frozen pool, not four separate pools.

        '
      convergence_reported_quantities:
      - F_train_true_nire
      - F_train_obs_nire
      - pseudo_true_own_level_coefficient_a
      - pseudo_true_pumping_coefficient_beta_q
      - pseudo_true_recharge_coefficient
      convergence_use: 'Reported as pre-defined benchmark diagnostics only. They may not be used to
        select n, to alter cells, sigma, gamma, n_ANALYSIS, hypotheses or SESOI. If the benchmark is
        still grossly unstable at 128 the protocol STOPS for external review rather than expanding
        the pool post hoc.

        '
