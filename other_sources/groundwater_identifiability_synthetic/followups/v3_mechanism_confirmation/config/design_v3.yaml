# design_v3 -- V3 prospective mechanism-confirmation experiment
#
# Isolated follow-up. Does not mutate design_v2.yaml or DESIGN_FREEZE_V2.md.
# Together with DESIGN_FREEZE_V3.md and BENCHMARK_DEFINITIONS.md this file
# determines V3_DESIGN_HASH.
#
# gates: {}  -- V3 defines no qualification gates.
# Hypotheses are post-hoc relative to V2 and prospective relative to V3.
#
