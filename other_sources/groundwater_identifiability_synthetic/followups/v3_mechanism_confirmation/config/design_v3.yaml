s6_null_construction:
  families:
    S6a_global_memory_null:
      label: S6a
      topology: null5
      C_ij: 0 for all i != j
      memory_control: independently targeted tau_relax via boundary leakage, same rule as coupled systems
      match_A_ii_to_coupled_reference: false
      match_marginal_head_variance: false
      retained_from_v1: true
    S6b_matched_local_dynamics_null:
      label: S6b
      source_coupled_system:
        topology: path5
        memory: MED
        gamma: MED
      geometry: path5 coordinates (identical candidate graph)
      construction: 'Build the coupled reference. Then set C_ij_null = 0 and C_i0_null = C_i0_reference
        + sum_j C_ij_reference, so A_ii_null = A_ii_reference and A_ij_null = 0. S_i, B_Q, B_R, forcing
        process, process-noise regime, measurement-noise regime, cadence, missingness, geometry, and observation
        design are preserved. The unforced equilibrium is preserved by setting b_null = (I - A_null) h_eq_ref
        where h_eq_ref = (I - A_ref)^{-1} b_ref.

        '
      match_A_ii_to_coupled_reference: true
      match_A_ij_off_diagonal: zero
      match_marginal_head_variance: false
      do_not_claim_variance_matching: true
  match_marginal_head_variance: false
  match_attempted_and_rejected: true
  rejection_rationale: 'The quantity that governs inference difficulty is already matched by construction:
    the snr_head definition ties observation-noise sd to REALIZED head sd, so S5 and both nulls face the
    same head signal-to-noise ratio despite different absolute variances. The residual marginal-variance
    difference is a structural consequence of coupling, not a nuisance.

    '
  required_reporting:
  - realized_head_sd
  - realized_observation_noise_sd
  - realized_snr_head
  - realized_snr_head_detrended
  - process_noise_variance_share
  - realized_local_persistence_mean_A_ii
  - rho_A
  - tau_relax_realized
  - pumping_excitation_fraction_L
  - false_edge_count
  - false_edge_any
  cross_scenario_comparison_caveat: 'S5-vs-S6a and S5-vs-S6b comparisons must be read alongside the reported
    realized variances and local-persistence diagnostics. S6a and S6b are scored separately.

    '
  variance_characterization_reference:
    topology: path5
    memory: MED
    gamma: MED
  characterization_artifact: outputs/provenance/S6_VARIANCE_CHARACTERIZATION_V2.json
s7_variants:
  delayed_recharge:
    description: truth applies a distributed lag to recharge; estimator uses the contemporaneous proxy
    lag_weights:
    - 0.5
    - 0.3
    - 0.2
  recharge_efficiency_mismatch:
    description: truth has B_R != B_Q; estimator retains the restricted B_R == B_Q family
    recharge_efficiency: 0.6
  weak_nonlinear_recharge:
    description: truth applies a mild concave recharge response
    form: R_effective = R * (1 - kappa_nl * R / (1 + R)),  kappa_nl = 0.25
  latent_common_climate:
    description: an unobserved common climate factor drives recharge at all nodes
    common_factor_sd: 0.2
    form: R = R_base * exp(f_t - log_sd^2/2),  f_t ~ AR1(phi=0.9), stationary sd = log_sd
    parameterization: 'common_factor_sd is the factor''s STATIONARY sd expressed in absolute recharge
      units at mean recharge, so log_sd = common_factor_sd / recharge.mean and the AR(1) innovation sd
      is log_sd*sqrt(1-phi^2). Two errors are ruled out by construction here: passing the stationary sd
      directly as an innovation sd (which inflates the factor 2.3x), and using an ADDITIVE factor, which
      leaves only ~2.5 sd of headroom above zero at the seasonal trough and pushes this cell into the
      clipping limit.

      '
    multiplicative_rationale: 'A climate anomaly scales recharge rather than adding a fixed volume, so
      the multiplicative form is the more physical one, and it keeps R strictly positive so this scenario
      carries ONLY its intended misspecification and no undocumented clipping nonlinearity. The state
      equation remains linear in R; only the exogenous input changes.

      '
s8_placebo_construction:
  description: "The estimator receives BOTH the ordinary observed/proxy pumping channel Q_real_observed\
    \ AND a separate pumping-like placebo P_placebo. Truth continues to respond to real pumping and has\
    \ a ZERO causal coefficient on P_placebo:\n  h_{t+1} = ... - B_Q * Q_real,t + 0 * P_placebo,t + ...\n\
    P_placebo is correlated with recharge/climate. This tests whether the estimator assigns a nonzero\
    \ causal/response effect to P_placebo CONDITIONAL ON real pumping. The placebo MUST NOT replace real\
    \ pumping.\n"
  placebo_correlation_with_recharge: 0.85
  placebo_causal_effect: 0.0
  estimator_receives:
  - Q_real_observed
  - P_placebo
  truth_receives:
  - Q_real
  required_outputs:
  - placebo_coef_L
  - placebo_coef_sign_L
  - placebo_coef_abs_L
  - placebo_false_effect_L
  - placebo_step_response_L
  - placebo_false_discovery
  false_effect_rule: abs(placebo_step_response) > 0.20 * abs(true_real_pumping_step_response)
  additional_diagnostics:
  - time_shift_placebo
  - season_preserving_permutation_placebo
  time_shift_fine_steps: 26
