# Forest City v3 claims / evidence contract
# A TRANSFERRED_MODEL or SCENARIO value MUST NOT be reported as OBSERVED
# or as empirically calibrated.

evidence_classes:
  OBSERVED:
    meaning: Directly measured or operator-published at the stated boundary.
  DERIVED:
    meaning: Algebraic identity from observed quantities at the same boundary (no model).
  MODEL_REPLAY:
    meaning: Frozen site controller applied to observed weather. Not a fit.
  TRANSFERRED_MODEL:
    meaning: Frozen external model (Masanet/ESIF) applied without refit.
  SCENARIO:
    meaning: Documented range or synthetic IT/parameter choice. Not as-operated.
  UNIDENTIFIED:
    meaning: Not closed by public evidence.

prohibited:
  - treating 35 F IT design rise as FACILITY_EFFECTIVE_DELTA_T
  - converting missing KFQD hours into observations
  - selecting a weather station because it yields zero DX
  - mapping 2023-2024 campus totals onto 2012 FRC1
  - choosing Delta-T to match annual water
  - QUANTITATIVE_PHYSICS_TRANSFER=PASS from annual-aggregate agreement with a transferred model
  - calling campus water withdrawal water consumption or cooling WUE
  - inferring effective facility Delta-T from CFM alone
  - reporting replay contrasts as causal effects or gallons
  - reporting cross-station sensitivity ranges as confidence intervals
  - reporting a numerical value-of-information score without explicit criteria, weights, and sensitivity analysis

frozen_findings_from_v2:
  QUANTITATIVE_PHYSICS_TRANSFER: NOT_VALIDATED
  FACILITY_EFFECTIVE_DELTA_T: UNIDENTIFIED
  FACILITY_AIRFLOW_CFM: UNIDENTIFIED
  FRC1_COOLING_ONLY_WATER_MAGNITUDE: UNIDENTIFIED
  FRC1_TO_LATER_CAMPUS_MAPPING: UNIDENTIFIED
  QUANTITATIVE_COOLING_WATER_TRANSFER: NOT_VALIDATED
  dashboard: SCREENSHOT_ONLY

accounting_semantics:
  CAMPUS_ANNUAL_ELECTRICITY: IDENTIFIED
  CAMPUS_ANNUAL_WATER_WITHDRAWAL: IDENTIFIED
  CAMPUS_WITHDRAWAL_INTENSITY: IDENTIFIED_DERIVED
  CAMPUS_WATER_CONSUMPTION: UNIDENTIFIED
  WITHDRAWAL_TO_CONSUMPTION_FRACTION: UNIDENTIFIED

replay_semantics:
  labels: [MODEL_REPLAY, NOT_CAUSAL_IDENTIFICATION, NOT_WATER_USE]
  observed_usable_hour_share: IDENTIFIED_WITHIN_REPLAY_SUPPORT
  true_full_period_regime_share: UNIDENTIFIED
  SUMMER_DX_STATION_ROBUSTNESS: STRONG_SUPPORT
  DETAILED_REGIME_SHARE_STATION_ROBUSTNESS: PARTIAL
